<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DARKO-TOUCH 2000</title>
<link rel="icon" href="icon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;width:100%}
  body{
    background:#e8e8ec;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:#111;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .slab{
    height:100dvh;width:100%;max-width:460px;margin:0 auto;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#ffffff,#f2f2f5 55%,#e3e3e9);
    box-shadow:inset 0 0 0 2px #c7c7d1,inset 0 0 44px rgba(255,255,255,.9),0 24px 60px rgba(80,85,105,.22);
    display:flex;flex-direction:column;
    padding:calc(2.4dvh + env(safe-area-inset-top)) 5.5vw calc(2.2dvh + env(safe-area-inset-bottom));
  }
  @media(min-width:560px){
    .slab{
      width:min(92vw, 52vh);
      height:min(92vh, 92.4vw);
      max-width:460px;
      max-height:818px;
      border-radius:36px;
      padding:24px 24px 20px;
    }
  }
  .slab::before{ /* chrome light sweep */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:10;
    background:linear-gradient(112deg,transparent 25%,rgba(255,255,255,.85) 42%,rgba(190,190,205,.25) 55%,transparent 72%);
    background-size:260% 100%;animation:sweep 11s ease-in-out infinite;
  }
  @keyframes sweep{0%,60%{background-position:130% 0}95%,100%{background-position:-50% 0}}

  header{position:relative;display:flex;align-items:center;justify-content:space-between}
  .head-left{text-align:left}
  header .name{font-weight:200;letter-spacing:.34em;font-size:clamp(16px,4.6vw,21px)}
  header .sub{letter-spacing:.24em;font-size:9.5px;color:#7a7a88;margin-top:3px}
  .led-pill{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.85);border:1px solid #d5d5de;
    border-radius:999px;padding:4px 9px;
  }
  .led{
    width:8px;height:8px;border-radius:50%;background:#c2c2ce;
    transition:background .15s ease,box-shadow .15s ease;
  }
  .led.loading{background:#d99b26;box-shadow:0 0 8px rgba(217,155,38,.8);animation:pulseLed .6s ease-in-out infinite}
  .led.live{background:#18a957;box-shadow:0 0 8px rgba(24,169,87,.8)}
  .led.err{background:#d93829;box-shadow:0 0 8px rgba(217,56,41,.8)}
  @keyframes pulseLed{0%,100%{opacity:.35}50%{opacity:1}}
  .led-txt{font-size:8.5px;font-weight:600;letter-spacing:.18em;color:#6c6c78}

  .np{
    margin-top:1.8dvh;text-align:center;position:relative;padding:1.4dvh 3vw;
    background:rgba(255,255,255,.72);border:1px solid #d7d7df;border-radius:16px;
    box-shadow:0 10px 24px rgba(120,120,150,.12);
  }
  .np .k{font-size:9px;letter-spacing:.3em;color:#8a8a96}
  .np .t{font-size:clamp(17px,5vw,23px);font-weight:300;margin-top:3px}
  .np .a{font-size:11.5px;color:#55555f;letter-spacing:.1em;margin-top:2px}
  .np .st{font-size:9.5px;letter-spacing:.24em;color:#9e781e;margin-top:6px;font-weight:600}

  .scroll-deck{
    flex:1;min-height:0;overflow-y:auto;margin-top:1.4dvh;padding-right:2px;
    scrollbar-width:none;
  }
  .scroll-deck::-webkit-scrollbar{display:none}
  h3{font-size:9.5px;letter-spacing:.3em;color:#8a8a96;margin:1.2dvh 0 .8dvh;position:relative}
  .row{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;position:relative;
    background:rgba(255,255,255,.85);border:1px solid #dedee5;border-radius:13px;
    padding:10px 13px;margin-bottom:7px;cursor:pointer;font-family:inherit;color:#111;
    box-shadow:0 4px 12px rgba(120,120,150,.07);
  }
  .row:active{transform:scale(.985)}
  .row .dot{width:8px;height:8px;border-radius:50%;background:#c9c9d4;flex:0 0 auto}
  .row.on{border-color:#b08a2e;background:#ffffff}
  .row.on .dot{background:#b08a2e;box-shadow:0 0 8px rgba(176,138,46,.8)}
  .row .tt{font-size:14px;font-weight:400}
  .row .tm{font-size:9.5px;color:#7f7f8c;letter-spacing:.1em;margin-top:2px}
  .row .go{margin-left:auto;color:#9b9ba8;font-size:11px;letter-spacing:.12em}

  .controls{display:flex;justify-content:center;gap:24px;position:relative;padding-top:1.2dvh}
  .controls button{
    width:54px;height:54px;border-radius:50%;border:1px solid #d2d2da;cursor:pointer;
    background:linear-gradient(160deg,#ffffff,#e9e9ef);color:#33333c;font-size:17px;
    box-shadow:0 8px 18px rgba(120,120,150,.15);
  }
  .controls button:active{transform:scale(.95)}
  .vol{margin-top:1.2dvh;position:relative}
  .vol input{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#dcdce3;outline:none}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(160deg,#fff,#d9d9e1);border:1px solid #c2c2cc;box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:pointer}
  .vol input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:linear-gradient(160deg,#fff,#d9d9e1);border:1px solid #c2c2cc;cursor:pointer}
  .foot{text-align:center;font-size:8.5px;letter-spacing:.26em;color:#8e8e9c;margin-top:1.1dvh;position:relative}
  @media (prefers-reduced-motion: reduce){.slab::before,.led.loading{animation:none !important}}
</style>
</head>
<body>
<main class="slab">
  <header>
    <div class="head-left">
      <div class="name">DARKO-TOUCH</div>
      <div class="sub">2000 &middot; ALL-WHITE MATRIX EDITION</div>
    </div>
    <div class="led-pill">
      <span class="led" id="sigLed"></span>
      <span class="led-txt" id="sigTxt">STANDBY</span>
    </div>
  </header>

  <section class="np" aria-live="polite">
    <div class="k">NOW PLAYING</div>
    <div class="t" id="npTitle">Ready</div>
    <div class="a" id="npArtist">Select a song or station for lottydarko</div>
    <div class="st" id="npState">STANDBY</div>
  </section>

  <div class="scroll-deck">
    <h3>SONGS &mdash; LOTTYDARKO</h3>
    <div id="songs"></div>

    <h3>STATIONS SPINNING LOTTYDARKO</h3>
    <div id="stations"></div>
  </div>

  <div class="controls">
    <button id="playBtn" aria-label="Play or pause">&#9654;</button>
    <button id="surpriseBtn" aria-label="Random live station">&#10227;</button>
  </div>
  <div class="vol"><input type="range" id="vol" min="0" max="100" value="85" aria-label="Volume"></div>
  <div class="foot">DIRECT AUDIO ONLY &middot; NO EMBEDS &middot; LOTTYDARKO</div>
</main>
<audio id="audio" preload="none" playsinline></audio>
<script>
  var SONGS = [
    { title:'Faces',              credit:'"Faces" \u2014 lottydarko',              file:'faces.mp3',              meta:'OUT NOV 20, 2026 \u00b7 EMPIRE' },
    { title:'A Thousand Ways',    credit:'"A Thousand Ways" \u2014 lottydarko',    file:'a-thousand-ways.mp3',    meta:'SINGLE \u00b7 DISTROKID' },
    { title:'The Passion Inside', credit:'"The Passion Inside" \u2014 lottydarko', file:'the-passion-inside.mp3', meta:'SINGLE \u00b7 EMPIRE' }
  ];
  var STATIONS = [
    { name:'idobi Anthm',       track:'"A Thousand Ways" \u2014 lottydarko',                     meta:'42 SPINS',             stream:'https://idobi-live-a.cdnstream1.com/10725_128.mp3?/' },
    { name:'KX Radio',          track:'"A Thousand Ways" / "The Passion Inside" \u2014 lottydarko', meta:'REGULAR ROTATION',     stream:'https://streaming.live365.com/a57624' },
    { name:'Sound Frontier FM', track:'"A Thousand Ways" \u2014 lottydarko',                     meta:'IN ROTATION',          stream:'https://streaming.live365.com/a63143' },
    { name:'flick Radio',       track:'"A Thousand Ways" \u2014 lottydarko',                     meta:'FEATURED NOV 9\u201314', stream:'https://listen.radioking.com/radio/491557/stream/548428' },
    { name:'Shoreditch Radio',  track:'"The Passion Inside" \u2014 lottydarko',                  meta:'ADDED NOV 2, 2026',    stream:null }
  ];

  var audio = document.getElementById('audio');
  var npTitle = document.getElementById('npTitle'),
      npArtist = document.getElementById('npArtist'),
      npState = document.getElementById('npState'),
      sigLed = document.getElementById('sigLed'),
      sigTxt = document.getElementById('sigTxt'),
      playBtn = document.getElementById('playBtn');

  var currentKey = null, activeStream = null, retryCount = 0, stallTimer = null, tuneToken = 0;

  function clearStallTimer(){
    if(stallTimer){ clearTimeout(stallTimer); stallTimer = null; }
  }

  function setStatus(ledClass, text){
    npState.textContent = text;
    sigTxt.textContent = text;
    sigLed.className = 'led' + (ledClass ? ' ' + ledClass : '');
    playBtn.innerHTML = (ledClass === 'live') ? '&#10073;&#10073;' : '&#9654;';
  }

  function mark(key){
    currentKey = key;
    document.querySelectorAll('.row').forEach(function(r){
      r.classList.toggle('on', r.dataset.key === key);
    });
  }

  function setNP(title, artist, ledClass, stateText){
    npTitle.textContent = title;
    npArtist.textContent = artist;
    setStatus(ledClass, stateText);
  }

  function startAudio(src, token){
    clearStallTimer();
    audio.pause();
    audio.src = src;
    audio.load();
    stallTimer = setTimeout(function(){
      if(token === tuneToken && audio.paused){
        setStatus('err', 'NO SIGNAL');
      }
    }, 12000);
    var p = audio.play();
    if(p && typeof p.catch === 'function'){
      p.catch(function(){
        if(token === tuneToken){
          clearStallTimer();
          setStatus('err', 'TAP PLAY');
        }
      });
    }
  }

  function playSong(s, key){
    tuneToken++;
    retryCount = 0;
    activeStream = null;
    mark(key);
    setNP('\u266a ' + s.credit, s.meta, 'loading', 'LOADING\u2026');
    startAudio(s.file, tuneToken);
  }

  function tune(st, key){
    tuneToken++;
    retryCount = 0;
    clearStallTimer();
    mark(key);
    if(!st.stream){
      activeStream = null;
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      setNP(st.name, '\u266a ' + st.track, '', 'STREAM COMING');
      return;
    }
    activeStream = st.stream;
    setNP(st.name, '\u266a ' + st.track, 'loading', 'LOADING\u2026');
    startAudio(st.stream, tuneToken);
  }

  var songsEl = document.getElementById('songs');
  SONGS.forEach(function(s, i){
    var b = document.createElement('button');
    b.className = 'row';
    b.dataset.key = 'song' + i;
    b.innerHTML = '<span class="dot"></span><span><span class="tt">\u266a ' + s.credit + '</span><div class="tm">' + s.meta + '</div></span><span class="go">MP3 &#8250;</span>';
    b.addEventListener('click', function(){ playSong(s, 'song' + i); });
    songsEl.appendChild(b);
  });

  var stEl = document.getElementById('stations');
  STATIONS.forEach(function(st, i){
    var b = document.createElement('button');
    b.className = 'row';
    b.dataset.key = 'st' + i;
    var badge = st.stream ? 'LIVE &#8250;' : 'STREAM COMING';
    b.innerHTML = '<span class="dot"></span><span><span class="tt">' + st.name + '</span><div class="tm">\u266a ' + st.track + ' &middot; ' + st.meta + '</div></span><span class="go">' + badge + '</span>';
    b.addEventListener('click', function(){ tune(st, 'st' + i); });
    stEl.appendChild(b);
  });

  audio.addEventListener('playing', function(){
    clearStallTimer();
    retryCount = 0;
    setStatus('live', activeStream ? 'ON AIR' : 'PLAYING');
  });
  audio.addEventListener('waiting', function(){
    if(currentKey && (activeStream || currentKey.indexOf('song') === 0)){
      setStatus('loading', 'BUFFERING\u2026');
    }
  });
  audio.addEventListener('stalled', function(){
    if(activeStream){
      setStatus('loading', 'RECONNECTING\u2026');
    }
  });
  audio.addEventListener('pause', function(){
    clearStallTimer();
    if(!audio.ended && currentKey && (activeStream || currentKey.indexOf('song') === 0)){
      setStatus('', 'PAUSED');
    }
  });
  audio.addEventListener('ended', function(){
    clearStallTimer();
    if(currentKey && currentKey.indexOf('song') === 0){
      setStatus('', 'FINISHED');
    }
  });
  audio.addEventListener('error', function(){
    clearStallTimer();
    if(activeStream && retryCount < 2){
      retryCount++;
      var token = tuneToken;
      var url = activeStream;
      setStatus('loading', 'RETRY ' + retryCount + '/2\u2026');
      setTimeout(function(){
        if(token === tuneToken){
          startAudio(url, token);
        }
      }, 1500);
      return;
    }
    if(currentKey && (activeStream || currentKey.indexOf('song') === 0)){
      setStatus('err', 'NO SIGNAL');
    }
  });

  playBtn.addEventListener('click', function(){
    if(!currentKey){ playSong(SONGS[0], 'song0'); return; }
    if(currentKey === 'st4'){ return; }
    if(audio.paused){
      setStatus('loading', 'LOADING\u2026');
      var p = audio.play();
      if(p && typeof p.catch === 'function'){
        p.catch(function(){ setStatus('err', 'NO SIGNAL'); });
      }
    } else {
      audio.pause();
    }
  });

  document.getElementById('surpriseBtn').addEventListener('click', function(){
    var liveIndices = [0, 1, 2, 3];
    var pick = liveIndices[Math.floor(Math.random() * liveIndices.length)];
    tune(STATIONS[pick], 'st' + pick);
  });

  document.getElementById('vol').addEventListener('input', function(e){
    audio.volume = e.target.value / 100;
  });
  audio.volume = 0.85;

  /* Native Capacitor initialization */
  (function initNative(){
    var Cap = window.Capacitor;
    if(!Cap || !Cap.Plugins) return;
    var P = Cap.Plugins;
    if(P.StatusBar){
      P.StatusBar.setStyle({ style: 'LIGHT' }).catch(function(){});
      P.StatusBar.setBackgroundColor({ color: '#f2f2f5' }).catch(function(){});
    }
    if(P.ScreenOrientation){
      P.ScreenOrientation.lock({ orientation: 'portrait' }).catch(function(){});
    }
    if(P.SplashScreen){
      P.SplashScreen.hide().catch(function(){});
    }
    if(P.App){
      P.App.addListener('backButton', function(){
        if(P.App.minimizeApp){ P.App.minimizeApp(); }
      });
    }
  })();
</script>
</body>
</html>
