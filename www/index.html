<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DARKO-TOUCH 2000</title>
<link rel="icon" href="icon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#e8e8ec;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:#111;
    display:flex;align-items:center;justify-content:center;
  }
  .slab{
    height:100dvh;width:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#ffffff,#f2f2f5 55%,#e3e3e9);
    box-shadow:inset 0 0 0 2px #c7c7d1,inset 0 0 44px rgba(255,255,255,.9);
    display:flex;flex-direction:column;padding:3.4dvh 6vw calc(2.4dvh + env(safe-area-inset-bottom));
  }
  @media(min-width:560px){.slab{border-radius:34px;height:96dvh}}
  .slab::before{ /* chrome light sweep */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(112deg,transparent 25%,rgba(255,255,255,.85) 42%,rgba(190,190,205,.25) 55%,transparent 72%);
    background-size:260% 100%;animation:sweep 11s ease-in-out infinite;
  }
  @keyframes sweep{0%,60%{background-position:130% 0}95%,100%{background-position:-50% 0}}
  header{text-align:center;position:relative}
  header .name{font-weight:200;letter-spacing:.44em;font-size:clamp(17px,5vw,23px)}
  header .sub{letter-spacing:.3em;font-size:10px;color:#8a8a96;margin-top:5px}
  .np{
    margin-top:2.4dvh;text-align:center;position:relative;padding:1.6dvh 3vw;
    background:rgba(255,255,255,.65);border:1px solid #d7d7df;border-radius:16px;
    box-shadow:0 10px 24px rgba(120,120,150,.14);
  }
  .np .k{font-size:9px;letter-spacing:.32em;color:#8a8a96}
  .np .t{font-size:clamp(19px,5.6vw,26px);font-weight:300;margin-top:4px}
  .np .a{font-size:12px;color:#55555f;letter-spacing:.14em;margin-top:2px}
  .np .st{font-size:10px;letter-spacing:.26em;color:#b08a2e;margin-top:7px}
  h3{font-size:10px;letter-spacing:.34em;color:#8a8a96;margin:2.4dvh 0 1dvh;position:relative}
  .row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;position:relative;
    background:rgba(255,255,255,.8);border:1px solid #dedee5;border-radius:14px;
    padding:13px 14px;margin-bottom:9px;cursor:pointer;font-family:inherit;color:#111;
    box-shadow:0 4px 12px rgba(120,120,150,.08);
  }
  .row:active{transform:scale(.985)}
  .row .dot{width:9px;height:9px;border-radius:50%;background:#c9c9d4;flex:0 0 auto}
  .row.on{border-color:#b08a2e}
  .row.on .dot{background:#b08a2e;box-shadow:0 0 8px rgba(176,138,46,.8)}
  .row .tt{font-size:15px;font-weight:400}
  .row .tm{font-size:10px;color:#8a8a96;letter-spacing:.12em;margin-top:1px}
  .row .go{margin-left:auto;color:#b9b9c4;font-size:17px}
  .controls{display:flex;justify-content:center;gap:26px;margin-top:auto;position:relative;padding-top:1.6dvh}
  .controls button{
    width:62px;height:62px;border-radius:50%;border:1px solid #d2d2da;cursor:pointer;
    background:linear-gradient(160deg,#ffffff,#e9e9ef);color:#33333c;font-size:19px;
    box-shadow:0 8px 18px rgba(120,120,150,.16);
  }
  .controls button:active{transform:scale(.95)}
  .vol{margin-top:1.6dvh;position:relative}
  .vol input{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#dcdce3;outline:none}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(160deg,#fff,#d9d9e1);border:1px solid #c2c2cc;box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:pointer}
  .vol input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:linear-gradient(160deg,#fff,#d9d9e1);border:1px solid #c2c2cc;cursor:pointer}
  .foot{text-align:center;font-size:9px;letter-spacing:.3em;color:#a5a5b1;margin-top:1.4dvh;position:relative}
  @media (prefers-reduced-motion: reduce){.slab::before{animation:none}}
</style>
</head>
<body>
<main class="slab">
  <header>
    <div class="name">DARKO-TOUCH</div>
    <div class="sub">2000 &middot; ALL-WHITE MATRIX EDITION</div>
  </header>

  <section class="np">
    <div class="k">NOW PLAYING</div>
    <div class="t" id="npTitle">Nothing yet</div>
    <div class="a" id="npArtist">Tap a song or a station &mdash; it starts itself</div>
    <div class="st" id="npState">STANDBY</div>
  </section>

  <h3>SONGS &mdash; LOTTYDARKO</h3>
  <div id="songs"></div>

  <h3>STATIONS SPINNING LOTTYDARKO</h3>
  <div id="stations"></div>

  <div class="controls">
    <button id="playBtn" aria-label="Play or pause">&#10073;&#10073;</button>
    <button id="surpriseBtn" aria-label="Surprise me">&#10227;</button>
  </div>
  <div class="vol"><input type="range" id="vol" min="0" max="100" value="85" aria-label="Volume"></div>
  <div class="foot">DIRECT AUDIO ONLY &middot; NO EMBEDS &middot; NO BUTTONS, ALL TOUCH</div>
</main>
<audio id="audio" preload="none"></audio>
<script>
  var SONGS = [
    { title:'Faces', file:'faces.mp3', meta:'OUT NOV 20, 2026 &middot; EMPIRE' },
    { title:'A Thousand Ways', file:'a-thousand-ways.mp3', meta:'SINGLE &middot; DISTROKID' },
    { title:'The Passion Inside', file:'the-passion-inside.mp3', meta:'SINGLE &middot; EMPIRE' }
  ];
  var STATIONS = [
    { name:'idobi Anthm', track:'"A Thousand Ways" &mdash; lottydarko', meta:'42 SPINS', stream:'https://idobi-live-a.cdnstream1.com/10725_128.mp3?/' },
    { name:'KX Radio', track:'"A Thousand Ways" / "The Passion Inside" &mdash; lottydarko', meta:'REGULAR ROTATION', stream:'https://streaming.live365.com/a57624' },
    { name:'Sound Frontier FM', track:'"A Thousand Ways" &mdash; lottydarko', meta:'IN ROTATION', stream:'https://streaming.live365.com/a63143' },
    { name:'flick Radio', track:'"A Thousand Ways" &mdash; lottydarko', meta:'FEATURED NOV 9&ndash;14', stream:'https://listen.radioking.com/radio/491557/stream/548428' },
    { name:'Shoreditch Radio', track:'"The Passion Inside" &mdash; lottydarko', meta:'ADDED NOV 2, 2026', stream:null }
  ];
  var audio = document.getElementById('audio');
  var npTitle = document.getElementById('npTitle'), npArtist = document.getElementById('npArtist'), npState = document.getElementById('npState');
  var currentKey = null;

  function mark(key){
    currentKey = key;
    document.querySelectorAll('.row').forEach(function(r){ r.classList.toggle('on', r.dataset.key===key); });
  }
  function setNP(title, artist, state){ npTitle.innerHTML = title; npArtist.innerHTML = artist; npState.textContent = state; }
  function playSong(s, key){
    mark(key); setNP(s.title, 'lottydarko', 'LOADING&hellip;'); npState.innerHTML = 'LOADING&hellip;';
    audio.src = s.file; audio.play();
  }
  function tune(st, key){
    mark(key);
    if(!st.stream){ audio.pause(); audio.removeAttribute('src'); audio.load(); setNP(st.name, st.track, 'STREAM COMING'); return; }
    setNP(st.name, st.track, 'LOADING&hellip;'); npState.innerHTML = 'LOADING&hellip;';
    audio.src = st.stream; audio.play();
  }
  var songsEl = document.getElementById('songs');
  SONGS.forEach(function(s,i){
    var b = document.createElement('button'); b.className='row'; b.dataset.key='song'+i;
    b.innerHTML = '<span class="dot"></span><span><span class="tt">' + s.title + '</span><div class="tm">' + s.meta + '</div></span><span class="go">&#8250;</span>';
    b.addEventListener('click', function(){ playSong(s,'song'+i); });
    songsEl.appendChild(b);
  });
  var stEl = document.getElementById('stations');
  STATIONS.forEach(function(st,i){
    var b = document.createElement('button'); b.className='row'; b.dataset.key='st'+i;
    b.innerHTML = '<span class="dot"></span><span><span class="tt">' + st.name + '</span><div class="tm">' + st.meta + '</div></span><span class="go">&#8250;</span>';
    b.addEventListener('click', function(){ tune(st,'st'+i); });
    stEl.appendChild(b);
  });
  audio.addEventListener('playing', function(){ npState.textContent = 'PLAYING'; });
  audio.addEventListener('pause', function(){ if(!audio.ended && currentKey){ npState.textContent = 'PAUSED'; } });
  audio.addEventListener('error', function(){ if(currentKey){ npState.textContent = 'NO SIGNAL'; } });
  document.getElementById('playBtn').addEventListener('click', function(){
    if(!currentKey){ playSong(SONGS[0],'song0'); return; }
    if(audio.paused){ audio.play(); } else { audio.pause(); }
  });
  document.getElementById('surpriseBtn').addEventListener('click', function(){
    var i = Math.floor(Math.random()*STATIONS.length);
    if(!STATIONS[i].stream){ i = 0; }
    tune(STATIONS[i],'st'+i);
  });
  document.getElementById('vol').addEventListener('input', function(e){ audio.volume = e.target.value/100; });
  audio.volume = 0.85;
</script>
</body>
</html>
